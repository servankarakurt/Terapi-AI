name: psychologyapp
description: Psikoloji chatbot mobil istemci
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  http: ^1.2.2
  record: ^6.2.1
  audioplayers: ^6.1.0
  google_sign_in: ^6.3.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "../asset/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1E1F3B"
  color_dark: "#0F1021"
  image: "../asset/Light.png"
  image_dark: "../asset/dark.png"
  android_12:
    image: "../asset/Light.png"
    image_dark: "../asset/dark.png"
    color: "#1E1F3B"
    color_dark: "#0F1021"
